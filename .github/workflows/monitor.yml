name: Alpha123 dual notifications
on:
  schedule:
    - cron: '2-57/5 * * * *'
  workflow_dispatch:
    inputs:
      send_test:
        description: Send a test to both channels
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: alpha123-monitor
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
      - name: Monitor and deliver
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          SEND_TEST: ${{ inputs.send_test }}
        shell: bash
        run: |
          python3 - <<'PY'
          import datetime as dt
          import json, os, pathlib, subprocess, time, uuid
          import urllib.request

          FIELDS = 'token name date time points amount total_amount phase status type utc box futures_listed created_timestamp updated_timestamp contract_address chain_id pretge bctge target_bnb actual_bnb'.split()
          LABELS = dict(token='项目代号', name='项目名称', date='日期', time='时间（北京时间）', points='积分门槛', amount='每份数量', total_amount='总数量（代币）', phase='阶段', status='状态', type='类型', contract_address='合约地址', chain_id='链 ID', section='栏目', updated_timestamp='更新时间戳', created_timestamp='创建时间戳')
          STATE = pathlib.Path('monitor-state.json')
          def bj():
              return dt.datetime.now(dt.timezone(dt.timedelta(hours=8))).strftime('%Y-%m-%d %H:%M:%S')
          def fetch(url, body=None):
              headers = {'Content-Type': 'application/json; charset=utf-8'} if body is not None else {'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0 Safari/537.36', 'Accept': 'application/json', 'Referer': 'https://alpha123.uk/zh/', 'Origin': 'https://alpha123.uk'}
              payload = None if body is None else json.dumps(body, ensure_ascii=False).encode('utf-8')
              req = urllib.request.Request(url, data=payload, headers=headers)
              with urllib.request.urlopen(req, timeout=20) as response:
                  return json.load(response)
          def snapshot(data):
              if not isinstance(data, dict) or not isinstance(data.get('airdrops'), list):
                  raise ValueError('Source schema invalid')
              today, result = bj()[:10], {}
              for raw in data['airdrops']:
                  if not isinstance(raw, dict) or not raw.get('token'):
                      continue
                  date = raw.get('date', '')
                  try:
                      dt.date.fromisoformat(date)
                  except (TypeError, ValueError):
                      continue
                  if date < today:
                      continue
                  record = {k: raw[k] for k in FIELDS if raw.get(k) not in (None, '', False)}
                  result[str(raw['token']) + '|phase=' + str(raw.get('phase') or 1)] = {'section': '今日空投' if date == today else '空投预告', 'record': record}
              return result
          def differences(old, current):
              events = []
              for key, item in current.items():
                  if key not in old:
                      events.append(dict(item, kind='新增'))
                      continue
                  changed = {k: [old[key]['record'].get(k), item['record'].get(k)] for k in FIELDS if old[key]['record'].get(k) != item['record'].get(k)}
                  if old[key]['section'] != item['section']:
                      changed['section'] = [old[key]['section'], item['section']]
                  if changed:
                      events.append(dict(item, kind='更新', changed=changed))
              for key, item in old.items():
                  if key not in current:
                      events.append(dict(item, kind='移除'))
              return events
          def value(v):
              return '未公布' if v is None or v == '' else str(v)
          def message(event):
              r = event['record']
              lines = ['【Alpha123 ' + event['kind'] + '】' + str(r['token']), '栏目：' + event['section']]
              for k in 'name date time points phase status type contract_address chain_id'.split():
                  if k in r:
                      lines.append(LABELS[k] + '：' + value(r[k]))
              try:
                  amount, total = float(r.get('amount', 0)), float(r.get('total_amount', 0))
                  if amount > 0 and total > 0:
                      shares = total / amount
                      lines.append('空投份数（约）：' + (f'{shares / 10000:.1f}万份' if shares >= 10000 else f'{round(shares)}份'))
              except (ValueError, TypeError):
                  pass
              if 'amount' in r:
                  lines.append('每份数量：' + value(r['amount']))
              if event.get('changed'):
                  lines.append('\n变更字段：')
                  for k, (a, b) in event['changed'].items():
                      lines.append('- ' + LABELS.get(k, k) + '：' + value(a) + ' → ' + value(b))
              lines += ['', '检测时间：' + bj() + '（北京时间）', '来源：https://alpha123.uk/zh/']
              return '\n'.join(lines)
          def git(*args):
              subprocess.run(['git', *args], check=True, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
          def checkpoint(state):
              STATE.write_text(json.dumps(state, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
              git('config', 'user.name', 'github-actions[bot]')
              git('config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com')
              git('add', '--', str(STATE))
              if subprocess.run(['git', 'diff', '--cached', '--quiet']).returncode:
                  git('commit', '-m', 'Persist monitor snapshot and delivery queue')
                  git('push', 'origin', 'HEAD:main')
          def enqueue(state, text):
              for channel in ('feishu', 'dingtalk'):
                  state['outbox'].append({'id': uuid.uuid4().hex, 'channel': channel, 'text': text, 'attempts': 0, 'due': 0})
          def deliver(channel, text):
              url = os.environ['FEISHU_WEBHOOK' if channel == 'feishu' else 'DINGTALK_WEBHOOK']
              prefix = 'https://open.feishu.cn/open-apis/bot/v2/hook/' if channel == 'feishu' else 'https://oapi.dingtalk.com/robot/send?access_token='
              if not url.startswith(prefix):
                  raise ValueError('Missing or invalid channel secret')
              body = {'msg_type': 'text', 'content': {'text': text}} if channel == 'feishu' else {'msgtype': 'text', 'text': {'content': text}}
              response = fetch(url, body)
              if response.get('code' if channel == 'feishu' else 'errcode') not in (0, '0'):
                  raise ValueError('Bot rejected message')
          def main():
              for key in ('FEISHU_WEBHOOK', 'DINGTALK_WEBHOOK'):
                  if not os.environ.get(key):
                      raise ValueError('Missing notification secret')
              state = json.loads(STATE.read_text(encoding='utf-8')) if STATE.exists() else {'outbox': []}
              failed = False
              try:
                  current = snapshot(fetch('https://alpha123.uk/api/data?fresh=1'))
                  events = differences(state['snapshot'], current) if 'snapshot' in state else []
                  if 'snapshot' not in state or os.environ.get('SEND_TEST') == 'true':
                      enqueue(state, '【Alpha123 云端监控测试】\n飞书和钉钉双通道测试。\n已成功获取网站数据，计划每 5 分钟检查（平台可能延迟）。\n不依赖电脑开机或 Codex 在线。\n发送时间：' + bj() + '（北京时间）')
                  for event in events:
                      enqueue(state, message(event))
                  state['snapshot'], state['last_check'] = current, bj()
                  state.pop('last_source_error', None)
                  print('SOURCE_OK records=' + str(len(current)) + ' changes=' + str(len(events)))
              except Exception as error:
                  state['last_source_error'] = bj() + ' ' + type(error).__name__
                  print('SOURCE_FAILED type=' + type(error).__name__)
                  failed = True
              # Persist the new snapshot AND queued messages before transmitting.
              # Never store credentials, response bodies, or webhook URLs in state/logs.
              checkpoint(state)
              for row in list(state['outbox'])[:6]:
                  if row['due'] > time.time():
                      continue
                  try:
                      deliver(row['channel'], row['text'])
                  except Exception as error:
                      row['attempts'] += 1
                      row['due'] = time.time() + min(3600, 300 * 2 ** min(row['attempts'] - 1, 4))
                      print('DELIVERY_RETRY channel=' + row['channel'] + ' type=' + type(error).__name__)
                      failed = True
                  else:
                      state['outbox'].remove(row)
                      print('DELIVERY_OK channel=' + row['channel'])
                  checkpoint(state)
              print('PENDING=' + str(len(state['outbox'])))
              if failed:
                  raise SystemExit(1)
          if __name__ == '__main__':
              main()
          PY
