name: Alpha123 public source check

# One manual test only. No schedule, no webhook secrets, no paid runner.
on:
  workflow_dispatch:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check public data response
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import urllib.request
          import urllib.error
          import re

          url = 'https://alpha123.uk/api/data?fresh=1'
          request = urllib.request.Request(url, headers={
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0 Safari/537.36',
              'Accept': 'application/json',
              'Referer': 'https://alpha123.uk/zh/',
              'Origin': 'https://alpha123.uk',
          })
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  status = response.status
                  data = json.load(response)
              if status != 200 or not isinstance(data, dict) or not isinstance(data.get('airdrops'), list):
                  raise ValueError('Unexpected response schema; not a valid source check')
              print('SOURCE_CHECK_OK HTTP=200 records=' + str(len(data['airdrops'])))
          except urllib.error.HTTPError as error:
              body = error.read(65536).decode('utf-8', errors='replace')
              title = re.search(r'<title[^>]*>(.*?)</title>', body, re.I | re.S)
              print('SOURCE_CHECK_FAILED HTTP=' + str(error.code))
              print('challenge=' + str(error.headers.get('cf-mitigated', '')))
              if title:
                  print('page_title=' + re.sub(r'\s+', ' ', title.group(1))[:120])
              raise SystemExit(1)
          except Exception as error:
              print('SOURCE_CHECK_FAILED type=' + type(error).__name__)
              raise SystemExit(1)
          PY
